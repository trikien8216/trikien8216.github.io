<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>trikien8216 — GitHub Profile</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      line-height: 1.7;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }

    header .info h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #e6edf3;
    }

    header .info span {
      font-size: 0.85rem;
      color: #8b949e;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* --- Markdown styles --- */
    #readme h1 {
      font-size: 2rem;
      font-weight: 700;
      border-bottom: 1px solid #30363d;
      padding-bottom: 12px;
      margin: 32px 0 16px;
      color: #e6edf3;
    }

    #readme h2 {
      font-size: 1.4rem;
      font-weight: 600;
      border-bottom: 1px solid #21262d;
      padding-bottom: 8px;
      margin: 32px 0 16px;
      color: #58a6ff;
    }

    #readme h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 24px 0 12px;
      color: #e6edf3;
    }

    #readme p {
      margin-bottom: 16px;
      color: #c9d1d9;
    }

    #readme a {
      color: #58a6ff;
      text-decoration: none;
    }

    #readme a:hover {
      text-decoration: underline;
    }

    #readme ul, #readme ol {
      padding-left: 24px;
      margin-bottom: 16px;
      color: #c9d1d9;
    }

    #readme li { margin-bottom: 6px; }

    #readme code {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 2px 8px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.88em;
      color: #ff7b72;
    }

    #readme pre {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    #readme pre code {
      background: none;
      border: none;
      padding: 0;
      color: #e6edf3;
      font-size: 0.9rem;
    }

    #readme blockquote {
      border-left: 3px solid #58a6ff;
      padding: 8px 16px;
      margin: 16px 0;
      background: #161b22;
      border-radius: 0 8px 8px 0;
      color: #8b949e;
    }

    #readme img {
      max-width: 100%;
      border-radius: 8px;
    }

    #readme hr {
      border: none;
      border-top: 1px solid #30363d;
      margin: 32px 0;
    }

    #readme table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    #readme th, #readme td {
      border: 1px solid #30363d;
      padding: 8px 16px;
      text-align: left;
    }

    #readme th {
      background: #161b22;
      color: #e6edf3;
      font-weight: 600;
    }

    #readme td { color: #c9d1d9; }

    .loading {
      text-align: center;
      padding: 60px;
      color: #8b949e;
      font-size: 1rem;
    }

    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid #21262d;
      color: #8b949e;
      font-size: 0.85rem;
      margin-top: 40px;
    }

    footer a { color: #58a6ff; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div class="avatar">H</div>
  <div class="info">
    <h1>trikien8216</h1>
    <span>README.md &mdash; trikien8216.github.io</span>
  </div>
</header>

<div class="container">
  <div id="readme">
    <div class="loading">Dang tai noi dung...</div>
  </div>
</div>

<footer>
  <a href="https://github.com/trikien8216/trikien8216.github.io">View on GitHub</a>
  &mdash; Built with GitHub Pages
</footer>

<script>
  fetch('https://raw.githubusercontent.com/trikien8216/trikien8216.github.io/main/README.md')
    .then(res => res.text())
    .then(text => {
      document.getElementById('readme').innerHTML = marked.parse(text);
    })
    .catch(() => {
      document.getElementById('readme').innerHTML =
        '<p style="color:#ff7b72;text-align:center;padding:40px">Khong the tai README.md. Vui long thu lai.</p>';
    });
</script>

</body>
</html>
